name: Build Debug APK

on:
  workflow_dispatch:   # 手动触发：Actions 页面点 "Run workflow"
  push:
    branches: [main]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Gradle and generate wrapper
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          ./gradle-8.7/bin/gradle wrapper --gradle-version 8.7

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" 2>/dev/null | head -20
          # Accept licenses and ensure platform 34 + build-tools are present
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          elif [ -x "$ANDROID_HOME/tools/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/tools/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            "$ANDROID_HOME/tools/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi
          echo "SDK setup done"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: |
          ./gradlew :app:assembleDebug --no-daemon --stacktrace --info 2>&1 | tee build-output.txt
          echo "BUILD_EXIT_CODE=$?"

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output-log
          path: build-output.txt

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Print error summary
        if: failure()
        run: |
          echo "========== BUILD FAILED - ERROR SUMMARY =========="
          if [ -f build-output.txt ]; then
            grep -E "error:|Error:|FAILURE|e:" build-output.txt | head -50 || echo "No error patterns found in log"
            echo ""
            echo "========== LAST 100 LINES OF BUILD LOG =========="
            tail -100 build-output.txt
          else
            echo "build-output.txt not found"
          fi
          echo "==================================================="
