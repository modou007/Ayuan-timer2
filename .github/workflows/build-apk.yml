name: Build Debug APK

on:
  workflow_dispatch:  # 手动触发：Actions 页面点 "Run workflow"
  push:
    branches: [main]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.7 (bypass wrapper download)
        run: |
          curl -fsSL -o "$HOME/gradle-8.7-bin.zip" https://services.gradle.org/distributions/gradle-8.7-bin.zip
          mkdir -p "$HOME/gradle"
          unzip -q "$HOME/gradle-8.7-bin.zip" -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          elif [ -x "$ANDROID_HOME/tools/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/tools/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            "$ANDROID_HOME/tools/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi
          echo "SDK setup done"

      - name: Build debug APK and locate
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build-output.txt
          BUILD_RC=${PIPESTATUS[0]}
          if [ "$BUILD_RC" -ne 0 ]; then
            echo "===== BUILD FAILED (rc=$BUILD_RC) ====="
            grep -E "e:|error:|FAILED|> Task :app.*FAILED|What went wrong|Could not" build-output.txt | head -40 || true
            echo "===== LAST 120 LINES OF BUILD LOG ====="
            tail -120 build-output.txt
            exit 1
          fi
          echo "===== BUILD PASSED ====="
          echo "===== Searching for APK under app/build ====="
          find app/build -name "*.apk" -print
          APK=$(find app/build -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "===== APK NOT FOUND ====="
            echo "app/build tree (dirs):"
            find app/build -type d | head -50
            echo "app/build/outputs files:"
            find app/build/outputs -type f 2>/dev/null | head -50 || echo "outputs missing"
            exit 1
          fi
          mkdir -p apk-out
          cp "$APK" apk-out/app-debug.apk
          echo "===== APK READY: apk-out/app-debug.apk ($(stat -c%s apk-out/app-debug.apk) bytes) ====="

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output-log
          path: build-output.txt

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: apk-out/app-debug.apk
          if-no-files-found: error
